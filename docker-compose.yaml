services:
  invest-lab:
    build: .
    container_name: ai-investor-lab
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - JUPYTER_ENABLE_LAB=yes
    restart: unless-stopped